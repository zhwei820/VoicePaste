# VoicePaste 配置文件（key=value，# 开头为注释）
# 改完保存后，需要重新启动 VoicePaste.exe 才生效。
#
# 本程序是前台控制台程序：命令行启动后一直挂在前台，按 Ctrl+C 退出。

# 程序自己的语音热键：按住这个键说话、松开自动粘贴。
# 必须和下面 voice_trigger_hotkey 完全一样（程序不模拟按键，只跟着真实按键走）。
talk_hotkey=Win+Alt

# 微信输入法里设置的语音输入快捷键。必须和 talk_hotkey 一致！
# 如果你想让程序用 Shift+Alt，请先在 微信输入法设置 里把语音快捷键改成
# Shift+Alt，并关掉 Windows 的 Alt+Shift 切换输入法，然后把这两行都改成
# Shift+Alt。
voice_trigger_hotkey=Win+Alt

# 松开语音键后，捕获框文字停止增长多久（毫秒）判定识别结束并自动粘贴。
commit_delay_ms=600

# 松开语音键后，最多等多久（毫秒）还没有任何文字就判定为失败。
no_text_timeout_ms=15000

# 结束后是否自动粘贴到原窗口。设为 false 时只把文字放进剪贴板，由你手动 Ctrl+V。
paste_on_finish=true

# 粘贴后是否恢复剪贴板里原来的内容。一般保持 false。
restore_clipboard=false

# 调试模式：设为 true 会打印捕获框文字变化等细节（排查用）。
debug=true
debug_keys=true
