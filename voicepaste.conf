# VoicePaste 配置文件（key=value，# 开头为注释）
# 改完保存后，需要重新启动 VoicePaste.exe 才生效。
#
# 本程序是前台控制台程序：命令行启动后一直挂在前台，按 Ctrl+C 退出。

# 按住此热键说话，松开即自动粘贴（按住说话 / 松开粘贴）。
talk_hotkey=Win+Alt

# 是否自动模拟按键调起电脑版微信的语音输入。
# 如果你倾向自己点微信的麦克风图标，可设为 false，程序只负责聚焦捕获框 + 读取并粘贴。
auto_trigger_voice=true

# 松开热键后，等待微信把文字提交进捕获框的毫秒数。
# 电脑慢/文字长时可适当调大（如 500）。
commit_delay_ms=300

# 松开后是否自动粘贴到原窗口。设为 false 时只把文字放进剪贴板，由你手动 Ctrl+V。
paste_on_finish=true

# 粘贴后是否恢复剪贴板里原来的内容。一般保持 false（留语音文字在剪贴板方便复用）。
restore_clipboard=false
